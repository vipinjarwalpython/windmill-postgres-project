name: Auto-run Pipeline on Code Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'windmill/scripts/**'
      - '.github/workflows/run-pipeline-on-push.yml'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: windmill
          POSTGRES_PASSWORD: windmill123
          POSTGRES_DB: windmill_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Initialize Database
        env:
          PGPASSWORD: windmill123
        run: |
          psql -h localhost -U windmill -d windmill_db -f db/init.sql

      - name: Run Pipeline
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: windmill
          DB_PASSWORD: windmill123
          DB_NAME: windmill_db
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python windmill/scripts/run_pipeline.py

      - name: Upload Pipeline Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pipeline-results
          path: |
            windmill/scripts/run_pipeline.py

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Pipeline failed. Check GitHub Actions logs for details."
          exit 1

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Pipeline completed successfully!"
