# .github/workflows/deploy.yml
# ============================================================
# GitHub Actions — Windmill CI/CD Pipeline
# ============================================================

name: Deploy & Run Windmill Pipeline

on:
  push:
    branches:
      - main

# Prevent parallel deployments
concurrency:
  group: windmill-deploy
  cancel-in-progress: true

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest

    env:
      WM_TOKEN: ${{ secrets.WINDMILL_TOKEN }}
      WM_WS: ${{ secrets.WINDMILL_WORKSPACE }}
      WM_BASE_URL: ${{ secrets.WINDMILL_BASE_URL }}

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------------
      # 3. Install Windmill CLI
      # --------------------------------------------------------
      - name: Install Windmill CLI
        run: npm install -g windmill-cli@1.699.0

      # --------------------------------------------------------
      # 4. Verify CLI installation
      # --------------------------------------------------------
      - name: Verify Windmill CLI
        run: |
          wmill --version

      # --------------------------------------------------------
      # 5. Validate required secrets
      # --------------------------------------------------------
      - name: Validate environment variables
        run: |
          test -n "$WM_TOKEN" || (echo "Missing WINDMILL_TOKEN" && exit 1)
          test -n "$WM_WS" || (echo "Missing WINDMILL_WORKSPACE" && exit 1)
          test -n "$WM_BASE_URL" || (echo "Missing WINDMILL_BASE_URL" && exit 1)

      # --------------------------------------------------------
      # 6. Ensure script file exists
      # --------------------------------------------------------
      - name: Check script file
        run: |
          ls -la
          test -f windmill/scripts/run_pipeline.py || (echo "Script file not found" && exit 1)

      # --------------------------------------------------------
      # 7. Deploy script to Windmill
      # --------------------------------------------------------
      - name: Deploy script to Windmill
        run: |
          wmill script push \
            windmill/scripts/run_pipeline.py \
            --workspace "$WM_WS" \
            --token "$WM_TOKEN" \
            --base-url "$WM_BASE_URL"

      # --------------------------------------------------------
      # 8. Trigger Windmill Job
      # --------------------------------------------------------
      - name: Trigger Windmill Job
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |

          echo "Triggering Windmill job..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$WM_BASE_URL/api/w/$WM_WS/jobs/run/p/u/admin/run_pipeline" \
            -H "Authorization: Bearer $WM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"db\": {
                \"host\": \"postgres\",
                \"port\": 5432,
                \"user\": \"windmill\",
                \"password\": \"windmill123\",
                \"dbname\": \"windmill_db\"
              },
              \"smtp_user\": \"$EMAIL_USER\",
              \"smtp_pass\": \"$EMAIL_PASS\",
              \"notify_email\": \"$NOTIFY_EMAIL\"
            }")

          BODY=$(echo "$RESPONSE" | head -n 1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Status: $STATUS"
          echo "Response: $BODY"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Windmill job trigger failed"
            exit 1
          fi

      # --------------------------------------------------------
      # 9. Send deployment notification
      # --------------------------------------------------------
      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false

          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}

          subject: "🚀 Windmill Deployment Successful"

          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.EMAIL_USER }}

          body: |
            Deployment completed successfully.

            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit SHA : ${{ github.sha }}
            Triggered By: ${{ github.actor }}

            Windmill Workspace:
            ${{ secrets.WINDMILL_WORKSPACE }}

            Windmill URL:
            ${{ secrets.WINDMILL_BASE_URL }}

      # --------------------------------------------------------
      # 10. Debug logs on failure
      # --------------------------------------------------------
      - name: Debug on failure
        if: failure()
        run: |
          echo "Workflow failed."
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"